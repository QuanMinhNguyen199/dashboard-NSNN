name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Không hủy lần deploy đang chạy giữa chừng: để nó hoàn tất rồi mới chạy lần sau.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build bản tĩnh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            tax-ops/package-lock.json

      - name: Cài phụ thuộc
        run: |
          npm ci --prefix web
          npm ci --prefix tax-ops

      # Hai URL riêng, với index.html thật cho từng đường dẫn đăng nhập.
      - name: Build cổng chung
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build:portal

      - name: Kiểm tra đường dẫn trên hosting tĩnh
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm --prefix tax-ops run test:portal:static

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: tax-ops/dist

  deploy:
    name: Phát hành
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
